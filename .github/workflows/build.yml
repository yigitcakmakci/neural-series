# Builds the Neural Series setup on GitHub's Windows machines, as build.ps1 does from a clean clone.
# - Every push to main, every pull request, and by hand (Actions → Build → Run workflow): build.ps1, the unit tests,
#   and the setup with its release notes kept as the run's artifact (14 days).
# - A version tag (v1.6.0): the same, then a DRAFT release with the setup, its SHA-256 and the notes from
#   CHANGELOG.md. A draft is not public: a person checks the setup and publishes it.
# The end-to-end tests open the apps' windows and stay on the developer's machine.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/neuralweb/package-lock.json

      # Windows PowerShell 5.1 and the .NET Framework C# compiler, as on the developer's machine
      - name: Build (build.ps1)
        shell: powershell
        run: .\build.ps1

      # After the build: NeuralNav's file operations test uses the compiled helper in out\stage.
      - name: Unit tests
        shell: pwsh
        run: |
          $tests = @(
            'tests/shared/test-i18n.js', 'tests/shared/test-language.js', 'tests/shared/test-handoff.js',
            'tests/shared/test-theme-sync.js', 'tests/shared/test-release-notes.js', 'tests/neuralterm/test-links.js',
            'tests/neuraldeck/test-commands.js', 'tests/neuralnav/test-ops.js', 'tests/neuralweb/test-store.js',
            'tests/neuralview/test-meta.js'
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "::group::$t"
            node $t
            if ($LASTEXITCODE -ne 0) { $failed += $t }
            Write-Host "::endgroup::"
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Release notes and SHA-256
        id: notes
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out -Filter 'Neural-Setup-*.exe').FullName
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $tagArgs = if ($tag) { @('--tag', $tag) } else { @() }
          node tools/release-notes.js --setup $setup @tagArgs --notes out/release-notes.md --title out/release-title.txt
          if ($LASTEXITCODE -ne 0) { throw 'release notes failed' }
          Get-Content out/release-notes.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-setup
          path: |
            out/Neural-Setup-*.exe
            out/release-notes.md
            out/release-title.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neural-setup
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Neural-Setup-*.exe --draft --verify-tag \
            --title "$(cat dist/release-title.txt)" --notes-file dist/release-notes.md
