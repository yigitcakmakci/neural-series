<title>NeuralCalc KX-9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: the calculator alone, centered on a flat ground; in the desktop shell (html.is-shell) the ground turns transparent and the device itself is the window. */
:root {
  --void: #06060b;
  --panel: #0c0d15;
  --panel-2: #141725;
  --panel-3: #1c2033;
  --screen: #03050a;
  --yellow: #fcee0a;
  --yellow-hi: #fff66b;
  --on-yellow: #0a0a0c;
  --cyan: #00f0ff;
  --red: #ff2a4f;
  --ink: #ebe8d8;
  --dim: #7d84a0;
  --line: #282d42;

  --cyan-a1: rgba(0, 240, 255, .07);
  --cyan-a3: rgba(0, 240, 255, .3);
  --cyan-a5: rgba(0, 240, 255, .5);
  --red-a1: rgba(255, 42, 79, .1);
  --red-a2: rgba(255, 42, 79, .24);
  --red-a5: rgba(255, 42, 79, .5);
  --yellow-a2: rgba(252, 238, 10, .22);
  --shadow: rgba(0, 0, 0, .6);

  --font-display: "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif;
  --font-body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, Consolas, monospace;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  background: var(--void);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  overflow-x: hidden;
}
.app { width: min(100%, 440px); }

/* ---------- device ---------- */
.device {
  --cut: 26px;
  padding: 2px;
  background: linear-gradient(140deg, var(--yellow) 0%, var(--yellow) 58%, var(--red) 100%);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.device.is-error { background: var(--red); }
.device-inner {
  display: grid;
  gap: 14px;
  padding-bottom: 14px;
  background: var(--panel);
  clip-path: polygon(0 0, calc(100% - var(--cut) + 1.2px) 0, 100% calc(var(--cut) - 1.2px), 100% 100%, calc(var(--cut) - 1.2px) 100%, 0 calc(100% - var(--cut) + 1.2px));
}

.dev-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px calc(var(--cut) + 8px) 8px 16px;
  background: var(--yellow);
  color: var(--on-yellow);
}
.dev-brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.dev-model { font: 700 1.35rem/1 var(--font-display); letter-spacing: .02em; }
.dev-name { font: 700 .78rem/1 var(--font-body); letter-spacing: .26em; }
.hazard {
  flex: 0 0 40px;
  height: 12px;
  margin-left: auto;
  background: repeating-linear-gradient(-45deg, var(--on-yellow) 0 4px, transparent 4px 8px);
}
.dev-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font: .82rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.led { width: 8px; height: 8px; background: var(--on-yellow); animation: blink 1.6s steps(1) infinite; }

/* ---------- screen ---------- */
.screen {
  container-type: inline-size;
  position: relative;
  display: grid;
  gap: 4px;
  margin: 0 14px;
  padding: 10px 14px 12px;
  overflow: hidden;
  background-color: var(--screen);
  background-image: repeating-linear-gradient(0deg, var(--cyan-a1) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 0 1px var(--cyan-a3), inset 0 0 36px var(--cyan-a1);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  animation: boot 1.1s steps(1) 1;
}
.screen.is-error { box-shadow: inset 0 0 0 1px var(--red), inset 0 0 40px var(--red-a2); }
.screen-top {
  display: flex;
  align-items: center;
  gap: 6px;
  font: .72rem/1 var(--font-mono);
  letter-spacing: .1em;
}
.chip {
  max-width: 16ch;
  padding: 3px 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--dim);
  box-shadow: inset 0 0 0 1px var(--line);
}
.chip.is-on { color: var(--on-yellow); background: var(--cyan); box-shadow: none; }
.screen-tag { margin-left: auto; color: var(--dim); white-space: nowrap; }

.expr-line {
  display: flex;
  justify-content: flex-end;
  min-height: 1.35em;
  overflow: hidden;
  white-space: nowrap;
  font: 1rem/1.35 var(--font-mono);
  color: var(--cyan);
  opacity: .9;
}
.screen.is-error .expr-line { color: var(--red); }

.main-line {
  height: 64px;
  line-height: 64px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  text-align: right;
  scrollbar-width: none;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.25rem, calc(100cqw / (var(--len, 1) * .62)), 3rem);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.main-line::-webkit-scrollbar { display: none; }
.main-line.is-idle { color: var(--dim); }
.main-line.is-result { color: var(--yellow); text-shadow: 0 0 18px var(--yellow-a2); }
.screen.is-error .main-line { color: var(--red); text-shadow: 0 0 16px var(--red-a5); }
.main-line.fx-glitch { animation: glitch .42s steps(1, end) 1; }
.t-op { color: var(--cyan); }
.t-fn { color: var(--yellow); }
.t-par { color: var(--dim); }
.t-ghost { color: var(--dim); opacity: .45; }

.preview-line {
  min-height: 1.35em;
  text-align: right;
  font: 1rem/1.35 var(--font-mono);
  color: var(--dim);
  overflow-wrap: anywhere;
}
.screen.is-error .preview-line { color: var(--red); letter-spacing: .04em; }
.screen.fx-deny { animation: deny .28s steps(2) 1; }

.scanbar {
  position: absolute;
  left: 0; right: 0; top: -48px;
  height: 48px;
  pointer-events: none;
  background: linear-gradient(transparent, var(--cyan-a1), transparent);
  animation: scan 5.5s linear infinite;
}

/* ---------- mode toggles ---------- */
.toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 14px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px 7px 10px;
  border: 0;
  background: transparent;
  color: var(--dim);
  font: .76rem/1 var(--font-mono);
  letter-spacing: .1em;
  box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
  cursor: pointer;
  touch-action: manipulation;
  transition: color .12s, box-shadow .12s, background-color .12s;
}
.toggle:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--dim); }
.toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: -3px; }
.toggle[aria-pressed="true"] { color: var(--cyan); background: var(--cyan-a1); box-shadow: inset 0 0 0 1px var(--cyan-a5); }
.toggle .val { color: var(--ink); }
.seg { padding: 4px; gap: 2px; }
.seg span { padding: 3px 6px; }
.seg[data-v="DEG"] span[data-v="DEG"],
.seg[data-v="RAD"] span[data-v="RAD"],
.seg span.is-on { background: var(--cyan); color: var(--on-yellow); }

/* ---------- keys ---------- */
.keys { display: grid; gap: 8px; margin: 0 14px; }
.keys-sci { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.keys-mem {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.keys-std { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.key {
  --tick: var(--yellow);
  position: relative;
  display: grid;
  place-items: center;
  height: 56px;
  padding: 0;
  border: 0;
  font: 600 1.45rem/1 var(--font-display);
  color: var(--ink);
  background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .12s, color .12s, box-shadow .12s, transform .06s;
}
.key::before {
  content: "";
  position: absolute;
  left: 6px; top: 6px;
  width: 8px; height: 2px;
  background: var(--tick);
  opacity: .75;
}
.key:hover { background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--tick); }
.key:focus-visible { outline: 2px solid var(--cyan); outline-offset: -4px; }
.key:active, .key.is-pressed { transform: translateY(1px); background: var(--tick); color: var(--on-yellow); box-shadow: none; }
.key sup { font-size: .6em; line-height: 0; margin-left: 1px; }
.key svg { width: 26px; height: 26px; }

.key.op { --tick: var(--cyan); color: var(--cyan); background: var(--cyan-a1); font-size: 1.7rem; }
.key.op:hover { text-shadow: 0 0 12px var(--cyan-a5); }
.key.util { --tick: var(--dim); }
.key.danger { --tick: var(--red); color: var(--red); background: var(--red-a1); }
.key.fn {
  --tick: var(--cyan);
  height: 42px;
  font: 600 1.05rem/1 var(--font-body);
  letter-spacing: .03em;
  background: var(--panel);
}
.key.fn::before { width: 5px; }
.key.mem {
  --tick: var(--yellow);
  height: 34px;
  font: .84rem/1 var(--font-mono);
  letter-spacing: .08em;
  color: var(--dim);
  background: transparent;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
}
.key.mem::before { display: none; }
.key.eq {
  --tick: var(--on-yellow);
  font-size: 1.9rem;
  color: var(--on-yellow);
  background: var(--yellow);
  box-shadow: none;
}
.key.eq:hover { background: var(--yellow-hi); box-shadow: 0 0 0 1px var(--yellow-hi); }
.key.eq:active, .key.eq.is-pressed { background: var(--cyan); color: var(--on-yellow); }

/* ---------- device footer ---------- */
.dev-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 14px;
  padding: 2px 4px 0 22px;
  font: .7rem/1 var(--font-mono);
  letter-spacing: .12em;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.barcode {
  flex: 0 1 84px;
  height: 14px;
  opacity: .7;
  background: repeating-linear-gradient(90deg, var(--dim) 0 1px, transparent 1px 3px, var(--dim) 3px 5px, transparent 5px 6px, var(--dim) 6px 7px, transparent 7px 10px);
}

@media (max-width: 420px) {
  .hazard, .screen-tag { display: none; }
  .key { height: 54px; }
}

/* ---------- desktop shell: frameless transparent window, the device is the window ---------- */
.win-btns { display: none; gap: 4px; }
.win-btn {
  display: grid;
  place-items: center;
  width: 26px;
  height: 22px;
  padding: 0;
  border: 0;
  color: var(--yellow);
  background: var(--on-yellow);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  cursor: pointer;
  transition: background-color .12s, color .12s;
}
.win-btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.win-btn:hover { color: var(--cyan); background: var(--panel-3); }
.win-btn.close:hover { color: var(--on-yellow); background: var(--red); }
.win-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: -3px; }

html.is-shell, html.is-shell body { background: transparent; }
html.is-shell body { display: block; min-height: 0; padding: 24px; overflow: hidden; user-select: none; }
html.is-shell .app { width: 440px; }
html.is-shell .device-wrap { filter: drop-shadow(0 0 10px var(--yellow-a2)) drop-shadow(0 8px 12px var(--shadow)); }
html.is-shell .dev-head,
html.is-shell .dev-foot { -webkit-app-region: drag; app-region: drag; }
html.is-shell .win-btns { display: flex; -webkit-app-region: no-drag; app-region: no-drag; }

/* ---------- motion ---------- */
@keyframes glitch {
  0% { transform: translateX(-3px) skewX(-10deg); text-shadow: 3px 0 var(--red), -3px 0 var(--cyan); clip-path: inset(0 0 52% 0); }
  20% { transform: translateX(4px); clip-path: inset(44% 0 0 0); }
  40% { transform: translateX(-1px); text-shadow: -2px 0 var(--red), 2px 0 var(--cyan); clip-path: inset(0 0 18% 0); }
  60%, 100% { transform: none; clip-path: none; }
}
@keyframes shake {
  0%, 100% { transform: none; }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}
.device-wrap.fx-error { animation: shake .34s ease-out 1; }
@keyframes deny { 50% { box-shadow: inset 0 0 0 1px var(--red), inset 0 0 30px var(--red-a2); } }
@keyframes boot { 0% { opacity: 1; } 8% { opacity: .3; } 12% { opacity: 1; } 20% { opacity: .55; } 26%, 100% { opacity: 1; } }
@keyframes scan { to { transform: translateY(calc(100% + 260px)); } }
@keyframes blink { 50% { opacity: .15; } }
@keyframes chip-pulse { 0%, 60% { background: var(--yellow); color: var(--on-yellow); } }
.chip.fx-pulse { animation: chip-pulse .5s steps(1) 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(() => {
  "use strict";

  const PREFIX = "kx9:";
  const load = (k, d) => { try { const v = localStorage.getItem(PREFIX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };

  /* ---------- engine (apps\shared\calc-engine.js, shared with NeuralDeck) ---------- */
  const { CalcError, ERR, evaluate, fmt } = window.NeuralCalcEngine;

  /* ---------- texts ---------- */
  // In the desktop shell the texts come in the series language (lang*.json through the preload). Opened in a plain
  // browser there are none: the HTML keeps its own Turkish and the texts this script writes are these (as in tr.json).
  const TR = {
    "err.syntax": "SÖZDİZİMİ HATASI",
    "err.div0": "SIFIRA BÖLME",
    "err.complex": "KARMAŞIK SONUÇ",
    "err.domain": "TANIM DIŞI DEĞER",
    "err.undef": "TANIMSIZ",
    "err.fact": "n! YALNIZ DOĞAL SAYIDA",
    "err.overflow": "TAŞMA",
    "err.hint": "{msg} · ⌫ ile düzelt · AC ile sıfırla",
    "time.none": "SÜRE — ms",
    "time.fast": "SÜRE <0.1 ms",
    "time.ms": "SÜRE {ms} ms",
    "angle.deg": "Açı birimi: derece. Değiştirmek için bas",
    "angle.rad": "Açı birimi: radyan. Değiştirmek için bas",
    "sound.on": "AÇIK",
    "sound.off": "KAPALI",
  };
  const T = window.neuralLang ? NeuralI18n.page(window) : NeuralI18n.create({ lang: "tr", dict: TR });
  document.querySelector(".app").lang = T.lang;

  /* ---------- tokens ---------- */
  // Tokens are display strings; "~" is a unary minus so it can be told apart from subtraction.
  const BIN = new Set(["+", "−", "×", "÷", "^"]);
  const CONSTS = new Set(["π", "e", "ANS"]);
  const isNum = (s) => /^[0-9.]$/.test(s) || s.includes("E");
  const isOpen = (s) => s.endsWith("(");
  const endsOperand = (s) => s !== undefined && (isNum(s) || s === ")" || CONSTS.has(s) || s === "!" || s === "%");
  const openCount = (t) => t.reduce((n, s) => n + (isOpen(s) ? 1 : s === ")" ? -1 : 0), 0);
  const source = (t) => t.join("") + ")".repeat(Math.max(0, openCount(t)));
  const plain = (t) => source(t).replace(/~/g, "−");

  function tokensFrom(s) {
    const neg = s[0] === "−";
    const body = neg ? s.slice(1) : s;
    const parts = body.includes("E") ? [body] : body.split("");
    return neg ? ["~", ...parts] : parts;
  }

  // Index where the last operand starts: a number, a constant, or a whole bracket group.
  function operandStart(t) {
    let end = t.length;
    while (end > 0 && (t[end - 1] === "!" || t[end - 1] === "%")) end--;
    let i = end - 1;
    if (i < 0) return -1;
    const s = t[i];
    if (s === ")") {
      let depth = 0;
      for (; i >= 0; i--) {
        if (t[i] === ")") depth++;
        else if (isOpen(t[i]) && --depth === 0) break;
      }
      if (i < 0) return -1;
    } else if (isNum(s)) {
      while (i > 0 && isNum(t[i - 1])) i--;
    } else if (!CONSTS.has(s)) {
      return -1;
    }
    if (i > 0 && t[i - 1] === "~") i--;
    return i;
  }

  /* ---------- state ---------- */
  const state = {
    tokens: [],
    ans: 0,
    hasAns: false,
    justEvaluated: false,
    lastExpr: "",
    error: null,
    memory: Number(load("memory", 0)) || 0,
    angle: load("angle", "DEG") === "RAD" ? "RAD" : "DEG",
    sci: load("sci", true) !== false,
    sound: load("sound", false) === true,
    lastMs: null,
    cue: "key",
  };
  const ctx = () => ({ angle: state.angle, ans: state.ans });

  /* ---------- input actions ---------- */
  function deny() {
    state.cue = "deny";
    fx(screenEl, "fx-deny");
  }
  function adoptResult() {
    state.tokens = tokensFrom(fmt(state.ans));
    state.justEvaluated = false;
  }
  function startFresh() {
    if (state.justEvaluated) { state.tokens = []; state.justEvaluated = false; }
  }

  function pushDigit(d) {
    startFresh();
    const t = state.tokens;
    const last = t[t.length - 1];
    if (last !== undefined && (last === ")" || CONSTS.has(last) || last === "!" || last === "%" || last.includes("E"))) t.push("×");
    let run = "";
    for (let i = t.length - 1; i >= 0 && /^[0-9.]$/.test(t[i]); i--) run = t[i] + run;
    if (d === ".") {
      if (run.includes(".")) { deny(); return; }
      if (!run) t.push("0");
      t.push(".");
      return;
    }
    if (run === "0") { t[t.length - 1] = d; return; }
    t.push(d);
  }

  function pushOp(op) {
    if (state.justEvaluated) adoptResult();
    const t = state.tokens;
    let last = t[t.length - 1];
    if (op === "−" && (last === undefined || isOpen(last) || last === "×" || last === "÷" || last === "^")) { t.push("~"); return; }
    if (last === "~") {
      if (op === "−") return;
      t.pop();
      last = t[t.length - 1];
    }
    if (last === undefined) { t.push("0", op); return; }
    if (isOpen(last)) { deny(); return; }
    if (BIN.has(last)) { t[t.length - 1] = op; return; }
    t.push(op);
  }

  function pushPrefix(s) {
    startFresh();
    const t = state.tokens;
    if (endsOperand(t[t.length - 1])) t.push("×");
    t.push(s);
  }

  function pushPostfix(s) {
    if (state.justEvaluated) adoptResult();
    const t = state.tokens;
    if (!endsOperand(t[t.length - 1])) { deny(); return false; }
    t.push(s);
    return true;
  }

  function closeParen() {
    const t = state.tokens;
    if (state.justEvaluated || openCount(t) <= 0 || !endsOperand(t[t.length - 1])) { deny(); return; }
    t.push(")");
  }

  function toggleSign() {
    if (state.justEvaluated) adoptResult();
    const t = state.tokens;
    const i = operandStart(t);
    if (i >= 0) {
      if (t[i] === "~") t.splice(i, 1);
      else t.splice(i, 0, "~");
      return;
    }
    const last = t[t.length - 1];
    if (last === "~") t.pop();
    else if (last === undefined || BIN.has(last) || isOpen(last)) t.push("~");
    else deny();
  }

  function reciprocal() {
    if (state.justEvaluated) adoptResult();
    const t = state.tokens;
    const i = operandStart(t);
    if (i < 0) { deny(); return; }
    if (i === 0) { t.unshift("1", "÷"); return; }
    t.splice(i, 0, "(", "1", "÷");
    t.push(")");
  }

  function backspace() {
    if (state.justEvaluated) adoptResult();
    if (!state.tokens.length) { deny(); return; }
    state.tokens.pop();
  }

  function recallMemory() {
    startFresh();
    const t = state.tokens;
    if (endsOperand(t[t.length - 1])) t.push("×");
    t.push(...tokensFrom(fmt(state.memory)));
  }

  function addMemory(sign) {
    let v;
    if (state.justEvaluated) v = state.ans;
    else if (!state.tokens.length) { deny(); return; }
    else {
      try { v = evaluate(source(state.tokens), ctx()); }
      catch (e) { if (!(e instanceof CalcError)) throw e; state.error = e.code; return; }
    }
    state.memory = parseFloat((state.memory + sign * v).toPrecision(15));
    save("memory", state.memory);
    fx(chipMem, "fx-pulse");
  }

  function equals() {
    const t = state.tokens;
    if (state.justEvaluated || !t.length) { deny(); return; }
    const t0 = performance.now();
    let v;
    try { v = evaluate(source(t), ctx()); }
    catch (e) { if (!(e instanceof CalcError)) throw e; state.error = e.code; return; }
    state.lastMs = performance.now() - t0;
    state.ans = v;
    state.hasAns = true;
    state.justEvaluated = true;
    state.lastExpr = plain(t);
    state.cue = "eq";
  }

  function press(k) {
    state.error = null;
    state.cue = "key";
    if (/^[0-9.]$/.test(k)) pushDigit(k);
    else if (k.startsWith("op:")) pushOp(k.slice(3));
    else if (k.startsWith("fn:") || k.startsWith("const:")) pushPrefix(k.slice(k.indexOf(":") + 1));
    else {
      switch (k) {
        case "(": pushPrefix("("); break;
        case ")": closeParen(); break;
        case "%": case "!": pushPostfix(k); break;
        case "sq": if (pushPostfix("^")) state.tokens.push("2"); break;
        case "inv": reciprocal(); break;
        case "neg": toggleSign(); break;
        case "ans": if (state.hasAns) pushPrefix("ANS"); else deny(); break;
        case "back": backspace(); break;
        case "clear": state.tokens = []; state.justEvaluated = false; break;
        case "=": equals(); break;
        case "mc": state.memory = 0; save("memory", 0); break;
        case "mr": recallMemory(); break;
        case "m+": addMemory(1); break;
        case "m-": addMemory(-1); break;
      }
    }
    render();
    if (state.error) { state.cue = "err"; fx(deviceWrap, "fx-error"); }
    else if (k === "=" && state.cue === "eq") fx(mainEl, "fx-glitch");
    sfx(state.cue);
  }

  /* ---------- view ---------- */
  const $ = (id) => document.getElementById(id);
  const deviceWrap = $("deviceWrap");
  const deviceEl = $("device");
  const screenEl = $("screen");
  const exprEl = $("exprLine");
  const mainEl = $("mainLine");
  const previewEl = $("previewLine");
  const chipAngle = $("chipAngle");
  const chipMem = $("chipMem");
  const sciKeys = $("sciKeys");
  const sciBtn = $("sciBtn");
  const angleBtn = $("angleBtn");
  const soundBtn = $("soundBtn");
  const latencyEl = $("latency");
  const clockEl = $("clock");

  function fx(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function make(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    n.textContent = text;
    return n;
  }

  function tokClass(s) {
    if (BIN.has(s) || s === "!" || s === "%") return "t-op";
    if (s === "(" || s === ")") return "t-par";
    if (isOpen(s) || CONSTS.has(s)) return "t-fn";
    return "";
  }

  function paintTokens(t) {
    const frag = document.createDocumentFragment();
    let len = 0;
    for (const s of t) {
      const shown = s === "~" ? "−" : s;
      frag.append(make("span", tokClass(s), shown));
      len += shown.length;
    }
    for (let i = openCount(t); i > 0; i--) { frag.append(make("span", "t-ghost", ")")); len++; }
    mainEl.replaceChildren(frag);
    return len;
  }

  function render() {
    const t = state.tokens;
    const err = state.error;
    screenEl.classList.toggle("is-error", !!err);
    deviceEl.classList.toggle("is-error", !!err);
    mainEl.classList.toggle("is-result", state.justEvaluated && !err);
    mainEl.classList.toggle("is-idle", !err && !state.justEvaluated && !t.length);

    exprEl.textContent = err ? plain(t)
      : state.justEvaluated ? state.lastExpr + " ="
      : state.hasAns ? "ANS = " + fmt(state.ans)
      : "";

    let len;
    if (err) { mainEl.textContent = "ERR " + ERR[err].hex; len = 8; }
    else if (state.justEvaluated) { const s = fmt(state.ans); mainEl.textContent = s; len = s.length; }
    else if (!t.length) { mainEl.textContent = "0"; len = 1; }
    else len = paintTokens(t);
    mainEl.style.setProperty("--len", String(len));
    mainEl.scrollLeft = mainEl.scrollWidth;

    let preview = "";
    if (err) preview = T("err.hint", { msg: T(ERR[err].key) });
    else if (!state.justEvaluated && t.length) {
      try {
        const s = fmt(evaluate(source(t), ctx()));
        if (s !== plain(t)) preview = "= " + s;
      } catch (e) { if (!(e instanceof CalcError)) throw e; }
    }
    previewEl.textContent = preview;

    chipAngle.textContent = state.angle;
    chipMem.classList.toggle("is-on", state.memory !== 0);
    chipMem.textContent = state.memory !== 0 ? "M " + fmt(state.memory) : "M";
    latencyEl.textContent = state.lastMs === null ? T("time.none")
      : state.lastMs < 0.1 ? T("time.fast")
      : T("time.ms", { ms: state.lastMs.toFixed(2) });
  }

  function syncToggles() {
    sciBtn.setAttribute("aria-pressed", String(state.sci));
    sciKeys.hidden = !state.sci;
    angleBtn.dataset.v = state.angle;
    angleBtn.setAttribute("aria-label", T(state.angle === "DEG" ? "angle.deg" : "angle.rad"));
    soundBtn.setAttribute("aria-pressed", String(state.sound));
    soundBtn.querySelector(".val").textContent = T(state.sound ? "sound.on" : "sound.off");
  }

  /* ---------- sound ---------- */
  let audio = null;
  const CUES = {
    key: [[1320, 0.03]],
    eq: [[880, 0.05], [1760, 0.09]],
    err: [[220, 0.1], [140, 0.16]],
    deny: [[300, 0.05]],
  };
  function sfx(kind) {
    if (!state.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      let at = audio.currentTime;
      for (const [freq, dur] of CUES[kind] || CUES.key) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = kind === "err" ? "sawtooth" : "square";
        osc.frequency.setValueAtTime(freq, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.05, at + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(gain).connect(audio.destination);
        osc.start(at);
        osc.stop(at + dur + 0.02);
        at += dur * 0.9;
      }
    } catch (e) { /* audio unavailable */ }
  }

  /* ---------- events ---------- */
  const keyButtons = new Map();
  document.querySelectorAll("[data-k]").forEach((b) => keyButtons.set(b.dataset.k, b));

  function flash(b) {
    b.classList.add("is-pressed");
    setTimeout(() => b.classList.remove("is-pressed"), 110);
  }

  deviceEl.addEventListener("mousedown", (e) => { if (e.target.closest(".key")) e.preventDefault(); });
  deviceEl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]");
    if (!b) return;
    flash(b);
    press(b.dataset.k);
  });

  const KEYMAP = {
    ".": ".", ",": ".",
    "+": "op:+", "-": "op:−", "*": "op:×", "x": "op:×", "/": "op:÷", "^": "op:^",
    "(": "(", ")": ")", "%": "%", "!": "!",
    "Enter": "=", "=": "=", "Backspace": "back", "Escape": "clear", "Delete": "clear",
    "s": "fn:sin(", "c": "fn:cos(", "t": "fn:tan(", "g": "fn:log(", "l": "fn:ln(", "r": "fn:√(",
    "p": "const:π", "e": "const:e", "a": "ans",
  };
  for (let d = 0; d <= 9; d++) KEYMAP[String(d)] = String(d);

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = KEYMAP[e.key];
    if (!k) return;
    // Let keyboard users activate a focused button with Enter as usual.
    if (e.key === "Enter" && e.target.matches && e.target.matches("button:focus-visible")) return;
    e.preventDefault();
    const b = keyButtons.get(k);
    if (b) flash(b);
    press(k);
  });

  sciBtn.addEventListener("click", () => {
    state.sci = !state.sci;
    save("sci", state.sci);
    syncToggles();
    sfx("key");
  });
  angleBtn.addEventListener("click", () => {
    state.angle = state.angle === "DEG" ? "RAD" : "DEG";
    save("angle", state.angle);
    syncToggles();
    render();
    sfx("key");
  });
  soundBtn.addEventListener("click", () => {
    state.sound = !state.sound;
    save("sound", state.sound);
    syncToggles();
    sfx("eq");
  });

  // The series language (only in the desktop shell): a pick shows from the next start of each program, so for now
  // the readout's bottom line shows the note.
  const languages = NeuralI18n.languageChoices(window, (note) => { previewEl.textContent = note; });
  const langBtn = $("langBtn");
  function syncLanguage() {
    const list = languages();
    langBtn.hidden = list.length < 2;
    const chosen = list.find((l) => l.checked()) || list[0];
    langBtn.replaceChildren(...list.map((l) => make("span", l === chosen ? "is-on" : "", l.id.toUpperCase())));
    if (chosen) {
      langBtn.title = T("lang.menu");
      langBtn.setAttribute("aria-label", T("lang.menu") + ": " + chosen.label);
    }
  }
  langBtn.addEventListener("click", async () => {
    const list = languages();
    const i = list.findIndex((l) => l.checked());
    const next = list[(i + 1) % list.length];
    if (!next) return;
    await next.pick();
    syncLanguage();
    sfx("key");
  });
  syncLanguage();

  const pad = (n) => String(n).padStart(2, "0");
  function timeNow() {
    const d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  const tick = () => { clockEl.textContent = timeNow(); };
  tick();
  setInterval(tick, 1000);

  /* ---------- desktop shell ---------- */
  // The Electron shell exposes window controls; everywhere else these buttons stay hidden.
  const shell = window.kx9;
  if (shell) {
    $("winMin").addEventListener("click", () => shell.minimize());
    $("winClose").addEventListener("click", () => shell.close());
    const appEl = document.querySelector(".app");
    const fitWindow = () => {
      const r = appEl.getBoundingClientRect();
      const cs = getComputedStyle(document.body);
      shell.fit(
        Math.ceil(r.width + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)),
        Math.ceil(r.height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom))
      );
    };
    new ResizeObserver(fitWindow).observe(appEl);
    // Clicks on the transparent margin and the cut corners fall through to the desktop.
    let passing = false;
    document.addEventListener("mousemove", (e) => {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const solid = !!(hit && hit.closest(".device"));
      if (passing === solid) {
        passing = !solid;
        shell.passThrough(passing);
      }
    });
  }

  syncToggles();
  render();
})();
</script>
