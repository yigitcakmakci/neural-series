<!doctype html>
<html lang="tr" class="theme-neon">
<head>
<meta charset="utf-8">
<title>İndirilenler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
<style>
  .drow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 10px 12px 16px; }
  .drow + .drow { box-shadow: inset 0 1px 0 var(--line); }
  .drow:hover { background: var(--panel-2); }
  .dic {
    display: grid; place-items: center; width: 46px; height: 46px; color: var(--on-accent); background: var(--accent-2);
    font: 700 .7rem/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; overflow: hidden;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%);
  }
  .drow.bad .dic { color: #0a0a0c; background: var(--danger); }
  .drow.paused .dic { background: var(--dim); }
  .dname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 1.08rem/1.25 var(--font-body); }
  .drow.done .dname { cursor: pointer; }
  .drow.done .dname:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
  .drow.bad .dname { color: var(--dim); text-decoration: line-through; }
  .dmeta { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font: .78rem/1.3 var(--font-mono); }
  .dmeta a:hover { color: var(--accent-2); }
  .dbar { height: 3px; margin-top: 7px; background: var(--line); }
  .dbar i { display: block; height: 100%; background: var(--accent-2); }
  .dacts { display: flex; gap: 2px; }
  .private-note { margin: 0 0 14px; color: var(--dim); font: .8rem/1.4 var(--font-mono); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="beam"></div></div>
<header class="top">
  <span class="mark">NW-1</span><h1>İndirilenler</h1>
  <nav><a href="neural://history/">Geçmiş</a><a href="neural://bookmarks/">Yer imleri</a><a href="neural://passwords/">Şifreler</a><a href="neural://downloads/" aria-current="page">İndirilenler</a><a href="neural://settings/">Ayarlar</a></nav>
</header>
<div class="rule"></div>
<main class="wrap">
  <div class="bar">
    <label class="field"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3a4 4 0 1 1 0 8a4 4 0 0 1 0-8zM10 10l3.5 3.5"/></svg><input id="q" type="search" placeholder="İndirilenlerde ara" autocomplete="off" spellcheck="false" aria-label="İndirilenlerde ara"></label>
    <button class="btn" id="open-dir" type="button">İndirme klasörünü aç</button>
    <button class="btn" id="clear" type="button">Listeyi temizle</button>
  </div>
  <div class="panel"><div class="panel-in" id="list"></div></div>
</main>
<script src="pages.js"></script>
<script src="downloads.js"></script>
</body>
</html>
