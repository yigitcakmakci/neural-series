<!doctype html>
<html lang="tr" class="theme-neon">
<head>
<meta charset="utf-8">
<title>Yer imleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
<style>
  .split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
  .tree { position: sticky; top: 16px; }
  .tree .panel-in { padding: 8px 6px; }
  .node { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; color: var(--ink); background: transparent; font: 600 1rem/1.15 var(--font-body); text-align: left; cursor: pointer; }
  .node svg { width: 15px; height: 15px; flex: 0 0 15px; color: var(--accent); }
  .theme-daylight .node svg { color: var(--ink); }
  .node span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node:hover { background: var(--panel-3); }
  .node.on { color: var(--on-accent); background: var(--accent); }
  .node.on svg { color: inherit; }
  .crumb { margin: 0 0 10px; color: var(--dim); font: .82rem/1.3 var(--font-mono); letter-spacing: .06em; }
  .crumb b { color: var(--ink); font-weight: 400; }
  .mrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 42px; padding: 4px 8px 4px 16px; }
  .mrow:hover { background: var(--panel-2); }
  .mrow .main { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .mrow .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 1.04rem/1.3 var(--font-body); cursor: pointer; }
  .mrow .title:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
  .mrow .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font: .8rem/1.3 var(--font-mono); }
  .mrow .folder-ic { width: 16px; height: 16px; color: var(--accent); }
  .theme-daylight .mrow .folder-ic { color: var(--ink); }
  .mrow .acts { display: flex; gap: 2px; opacity: 0; }
  .mrow:hover .acts, .mrow:focus-within .acts { opacity: 1; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } .tree { position: static; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="beam"></div></div>
<header class="top">
  <span class="mark">NW-1</span><h1>Yer imleri</h1>
  <nav><a href="neural://history/">Geçmiş</a><a href="neural://bookmarks/" aria-current="page">Yer imleri</a><a href="neural://passwords/">Şifreler</a><a href="neural://downloads/">İndirilenler</a><a href="neural://settings/">Ayarlar</a></nav>
</header>
<div class="rule"></div>
<main class="wrap">
  <div class="bar">
    <label class="field"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3a4 4 0 1 1 0 8a4 4 0 0 1 0-8zM10 10l3.5 3.5"/></svg><input id="q" type="search" placeholder="Yer imlerinde ara" autocomplete="off" spellcheck="false" aria-label="Yer imlerinde ara"></label>
    <button class="btn" id="add-mark" type="button">+ Yer imi</button>
    <button class="btn" id="add-folder" type="button">+ Klasör</button>
  </div>
  <div class="split">
    <aside class="tree panel"><div class="panel-in" id="tree"></div></aside>
    <section>
      <p class="crumb" id="crumb"></p>
      <div class="panel"><div class="panel-in" id="list"></div></div>
    </section>
  </div>
</main>

<dialog class="hud" id="dlg">
  <form method="dialog">
    <div class="body">
      <h2 id="dlg-title">Yer imini düzenle</h2>
      <div class="content">
        <label><span class="label">Ad</span><input id="f-title" type="text" autocomplete="off" required></label>
        <label id="f-url-wrap"><span class="label">Adres</span><input id="f-url" type="text" autocomplete="off" spellcheck="false"></label>
        <label><span class="label">Klasör</span><select id="f-parent"></select></label>
      </div>
      <div class="btns"><button class="btn" value="cancel" formnovalidate>Vazgeç</button><button class="btn primary" value="ok">Kaydet</button></div>
    </div>
  </form>
</dialog>
<script src="pages.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
