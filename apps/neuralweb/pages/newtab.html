<!doctype html>
<html lang="tr" class="theme-neon">
<head>
<meta charset="utf-8">
<title data-i18n="tab.new-tab">Yeni sekme</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body class="ntp">
<div class="bg" aria-hidden="true"><div class="beam"></div></div>
<main class="ntp-main">
  <div class="ntp-brand" aria-hidden="true"><span class="m">NW-1</span><span class="n">NEURALWEB</span><span class="hz"></span></div>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="shield-line" id="shield-line" hidden></div>
  <form class="search" id="search" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3a4 4 0 1 1 0 8a4 4 0 0 1 0-8zM10 10l3.5 3.5"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Google'da ara veya adres yaz" aria-label="Google'da ara veya adres yaz" data-i18n-placeholder="omni.placeholder" data-i18n-aria-label="omni.placeholder">
    <button class="go" type="submit" data-i18n="ntp.go">ARA</button>
  </form>
  <section class="import" id="import" hidden>
    <div class="import-txt">
      <b data-i18n="ntp.import.title">Edge'den mi geliyorsun?</b>
      <span data-i18n="ntp.import.text">Yer imlerini ve tarama geçmişini tek seferde NeuralWeb'e aktar.</span>
    </div>
    <a class="btn primary" href="neural://settings/#import" data-i18n="imp.go">Aktar</a>
    <button class="btn" id="import-later" type="button" data-i18n="ntp.import.later">Daha sonra</button>
  </section>
  <section class="tiles" id="tiles" aria-label="Sık ziyaret edilenler" data-i18n-aria-label="ntp.tiles"></section>
</main>
<footer class="ntp-foot">
  <a href="neural://history/" data-i18n="page.history">Geçmiş</a>
  <a href="neural://bookmarks/" data-i18n="page.bookmarks">Yer imleri</a>
  <a href="neural://passwords/" data-i18n="page.passwords">Şifreler</a>
  <a href="neural://downloads/" data-i18n="page.downloads">İndirilenler</a>
  <a href="neural://settings/" data-i18n="page.settings">Ayarlar</a>
</footer>
<script src="i18n.js"></script>
<script src="pages.js"></script>
<script src="newtab.js"></script>
</body>
</html>
