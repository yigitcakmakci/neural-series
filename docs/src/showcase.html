<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="neural.css">
<style>
  html, body { width: 1600px; height: 980px; }
  .shot { position: absolute; filter: drop-shadow(0 22px 34px rgba(0, 0, 0, .75)) drop-shadow(0 0 28px rgba(0, 240, 255, .10)); }
  .label {
    position: absolute; z-index: 9; display: flex; align-items: center; gap: 8px;
    color: var(--ink); font: 15px/1 var(--font-mono); letter-spacing: .14em;
  }
  .label::before { content: ""; width: 8px; height: 8px; background: var(--cyan); }
</style>
</head>
<body>
<div class="device"><div class="body">
  <div class="band">
    <span class="code">NS-1</span><span class="name">LINEUP</span>
    <span class="readout">7 UNITS ONLINE // v1.3.0 LEVENT</span><span class="hazard"></span>
  </div>
  <div class="screen"></div>
  <img class="shot" src="../images/screenshots/neuralweb.png" style="left: 40px; top: 84px; width: 740px;">
  <img class="shot" src="../images/screenshots/neuralview.png" style="left: 690px; top: 118px; width: 520px;">
  <img class="shot" src="../images/screenshots/neuralcalc.png" style="left: 1262px; top: 84px; width: 262px;">
  <img class="shot" src="../images/screenshots/neuralterm.png" style="left: 70px; top: 548px; width: 580px;">
  <img class="shot" src="../images/screenshots/neuralnav.png" style="left: 560px; top: 500px; width: 600px;">
  <img class="shot" src="../images/screenshots/neuralpad.png" style="left: 1050px; top: 578px; width: 480px;">
  <img class="shot deck" src="../images/screenshots/neuraldeck.png" style="left: 560px; top: 250px; width: 470px;">
  <div class="label" style="left: 52px; top: 940px;">DK-0 · NW-1 · VW-3 · KX-9 · NT-5 · NV-4 · NP-7</div>
</div></div>
</body>
</html>
